[project]
name = "narrative-core"
version = "0.1.0"
description = "本地叙事证据工作台"
requires-python = ">=3.12"
dependencies = [
    "deepseek-harness-sdk==0.1.5rc1",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/narrative"]

[project.scripts]
narrative = "narrative.cli:main"
narrative-desktop = "narrative.native_app:main"

[dependency-groups]
dev = ["ruff>=0.11", "pyright>=1.1", "pytest>=8"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

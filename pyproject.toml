[project]
name = "narrative-core"
version = "0.1.0"
description = "本地叙事证据工作台"
requires-python = ">=3.12"
dependencies = [
    "deepseek-harness-sdk==0.2.1rc2",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# 本机的 data/ 有上万个工程文件；不剪枝的话构建会把整棵树走一遍（慢到被系统杀掉）。
skip-excluded-dirs = true
exclude = ["/data", "/artifacts", "/.workbuddy-ai", "/.venv", "/dist"]

[tool.hatch.build.targets.wheel]
packages = ["src/narrative"]
# 发布包里只有代码和合成样例：原文、工程库、提取缓存、会话、资料一律不进。
exclude = [
  "src/narrative/texts",
  "**/*.sqlite*",
  "**/*.db",
  "**/*.db-wal",
  "**/*.db-shm",
  "**/*_extraction/**",
  "**/*_chats/**",
  "**/*_material/**",
  "**/__pycache__/**",
]

[tool.hatch.build.targets.sdist]
# 显式列目录：默认会走遍整个工程树，而本机的 data/ 里有上万个工程文件——
# 既慢，也正是「发布包里混进工程数据」的来路。
include = [
  "/src",
  "/tests",
  "/docs",
  "/scripts",
  "/examples",
  "/README.md",
  "/REUSE.md",
  "/pyproject.toml",
]
exclude = ["/src/narrative/texts", "**/*.sqlite*", "**/__pycache__/**"]

[project.scripts]
narrative = "narrative.cli:main"
narrative-desktop = "narrative.native_app:main"
narrative-mcp = "narrative.mcp_server:main"

[dependency-groups]
dev = ["ruff>=0.11", "pyright>=1.1", "pytest>=8"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

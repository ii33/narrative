<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>制作稿 · 正文对照编排</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f4ee;color:#20382f;font:15px/1.65 system-ui,sans-serif}header{background:#284739;color:white;padding:14px 2vw;display:flex;justify-content:space-between;align-items:center}main{display:grid;grid-template-columns:minmax(130px,14%) minmax(175px,20%) minmax(520px,1fr);height:85vh;overflow:auto}nav,aside{padding:14px;border-right:1px solid #bccbbf}section{overflow:auto;position:relative}h2{font-size:17px}button{font:inherit;color:inherit;background:#fff;border:1px solid #a5b9ad;border-radius:4px;cursor:pointer}article,.heads{display:grid;grid-template-columns:44% 56%}.heads{position:sticky;top:0;z-index:2;background:#e2ebe2}.heads b,p{padding:10px;margin:0}.body{border-bottom:1px solid #bfcabe;padding:12px;text-align:left;border-radius:0}.zone{border-bottom:1px solid #bfcabe;background:#f1f4ed}.bar{z-index:1;align-self:stretch;text-align:left;padding:3px 8px;background:#cde3d8;border-color:#88ab99;overflow:auto}.chosen{outline:2px solid #25664b;outline-offset:-2px}.source{background:#e3eee3}dialog{max-width:660px;border:1px solid #8aab98}dialog p{padding:4px}small{color:#516e61}</style>
<header><strong>已撤销的制作稿原型　/　荒原上的那场花雨</strong><button style="color:#234" id="preview">制作稿预览</button></header><main><nav><h2>场列表</h2>开场段落<hr>荒原上的那场花雨</nav><aside><h2>制作详情</h2><div id="detail"></div></aside><section><div class="heads"><b>正文表 ↓</b><b>元素编排 ↓</b></div><article id="grid"></article></section></main><dialog id="sheet"><h2>荒原上的那场花雨</h2><div id="formatted"></div><button onclick="sheet.close()">关闭</button></dialog>
<script>
const blocks=[['动作','傅山挑走发黑的旧石，换上一块新石，嵌进原位。',4],['声音','石头嵌合的一声闷响。紧接着，一圈极低的嗡鸣从阵心深处爬起来。',3],['对白 · 傅山','李强，站阵心。别踩纹。',2]];
const items=[['取出旧石',0,2,0,[0],'可复用资源 · 能量石道具卡｜本次使用失效形态'],['嵌入新石',2,4,0,[0],'可复用资源 · 能量石道具卡｜本次使用可用形态'],['嵌合闷响',3,5,1,[0,1],'效果声需求 · 与嵌合瞬间对齐'],['阵心低鸣',5,9,1,[1],'声音需求 · 延续到对白末尾（制作推导）'],['傅山发话',7,9,0,[2],'可复用资源 · 傅山角色卡｜现场对白']];
const starts=blocks.map((_,i)=>blocks.slice(0,i).reduce((n,b)=>n+b[2],0));let selected=2;
function add(parent,tag,txt){const e=document.createElement(tag);e.textContent=txt;parent.append(e);return e}
function render(){grid.replaceChildren();detail.replaceChildren();grid.style.gridTemplateRows='repeat(9,minmax(42px,auto))';blocks.forEach(([type,body,h],i)=>{const row=(starts[i]+1)+' / span '+h,b=add(grid,'button',type+'　'+body);b.className='body'+(items[selected][4].includes(i)?' source':'');b.style.gridArea=row.split(' / ')[0]+' / 1 / span '+h+' / 2';b.onclick=()=>{detail.replaceChildren();add(detail,'b',type+' · 关联元素');items.forEach((v,k)=>{if(v[4].includes(i))add(detail,'button',v[0]).onclick=()=>{selected=k;render()}})};const z=add(grid,'div','');z.className='zone';z.style.gridColumn='2';z.style.gridRow=row});
items.forEach(([name,start,end,lane],i)=>{const b=add(grid,'button',name);b.className='bar'+(i===selected?' chosen':'');b.style.gridColumn='2';b.style.gridRow=(start+1)+' / '+(end+1);b.style.marginLeft=(lane*48+2)+'%';b.style.marginRight=((1-lane)*48+2)+'%';b.onclick=()=>{selected=i;render()}});const v=items[selected];add(detail,'b',v[0]);add(detail,'p',v[5]);add(detail,'small','正文依据 · '+v[4].map(i=>blocks[i][0]).join('、'))}
preview.onclick=()=>{formatted.replaceChildren();blocks.forEach(([type,body,h],i)=>{const s=starts[i],e=s+h;add(formatted,'h3',type);add(formatted,'p',body);items.filter(v=>v[1]<e&&v[2]>s).forEach(v=>{const label=v[1]<s?'持续':items.some(w=>w!==v&&w[1]<=v[1]&&w[2]>v[1])?'同时':'起';add(formatted,'p',label+' · '+v[0]+(v[1]>=s?'　'+v[5]:'')+(v[2]>e?'（续至下区）':v[1]<s?'（本区结束）':''))})});sheet.showModal()};render()
</script></html>
